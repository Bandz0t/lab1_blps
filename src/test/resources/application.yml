spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/test-migration
  jta:
    enabled: false

storage:
  minio-enabled: false

app:
  kafka:
    enabled: false
    consumers:
      enabled: false
    topics:
      video-processing-requested: video.processing.requested
      video-processing-completed: video.processing.completed
      moderation-decision: moderation.decision
      monthly-payout-requested: monthly.payout.requested
      payout-registration-requested: payout.registration.requested
      payout-registration-completed: payout.registration.completed
  scheduler:
    monthly-payout:
      enabled: false
    payout-registration-retry:
      enabled: false
  outbox:
    datasource:
      url: jdbc:h2:mem:outboxdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      driver-class-name: org.h2.Driver
    flyway:
      enabled: true
      locations: classpath:db/outbox
  messaging:
    moderation:
      channel: moderation.decision

security:
  jwt:
    secret: dGhpcy1pcy12ZXJ5LXNlY3JldC1rZXktZm9yLWp3dCEh
    ttl-minutes: 60
