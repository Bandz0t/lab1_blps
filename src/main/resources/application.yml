spring:
  application:
    name: youtube-monetization

  datasource:
    url: jdbc:postgresql://localhost:5432/youtube_monetization
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  jta:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

storage:
  minio-enabled: true
  bucket: videos
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin

server:
  port: 8080

logging:
  level:
    org.flywaydb: info

copyright:
  vosk-model-path: models/vosk-model-small-en-us-0.15
  banned-words: good,morning,sure,everybody
  ffmpeg-binary: ffmpeg

security:
  jwt:
    # base64 for 32-byte key: "this-is-very-secret-key-for-jwt!!"
    secret: dGhpcy1pcy12ZXJ5LXNlY3JldC1rZXktZm9yLWp3dCEh
    ttl-minutes: 60

app:
  rabbitmq:
    enabled: true
  messaging:
    moderation:
      exchange: youtube.moderation.exchange
      queue: youtube.moderation.queue
      routing-key: moderation.decision
