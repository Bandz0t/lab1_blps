spring:
  application:
    name: youtube-monetization

  datasource:
    url: jdbc:postgresql://localhost:5432/youtube_monetization
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  jta:
    enabled: true
    atomikos:
      properties:
        transaction-manager-unique-name: youtube-monetization-tm
        default-jta-timeout: 60
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

storage:
  minio-enabled: true
  bucket: videos
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin

server:
  port: 8080

logging:
  level:
    org.flywaydb: info


copyright:
  vosk-model-path: models/vosk-model-small-en-us-0.15
  banned-words: good,morning,sure,everybody
  ffmpeg-binary: ffmpeg

security:
  jwt:
    secret: change-this-lab2-secret-change-this-lab2-secret
    ttl-seconds: 86400
