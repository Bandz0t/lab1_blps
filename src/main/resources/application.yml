spring:
  application:
    name: youtube-monetization

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/youtube_monetization
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  jta:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:youtube-monetization-workers}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

storage:
  minio-enabled: true
  bucket: videos
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin

server:
  port: 8080

logging:
  level:
    org.flywaydb: info

copyright:
  vosk-model-path: models/vosk-model-small-en-us-0.15
  banned-words: good,morning,sure,everybody
  ffmpeg-binary: ffmpeg

security:
  jwt:
    # base64 for 32-byte key: "this-is-very-secret-key-for-jwt!!"
    secret: dGhpcy1pcy12ZXJ5LXNlY3JldC1rZXktZm9yLWp3dCEh
    ttl-minutes: 60

app:
  node-id: ${APP_NODE_ID:local-node}
  kafka:
    enabled: true
    consumers:
      enabled: true
    topics:
      video-processing-requested: video.processing.requested
      video-processing-completed: video.processing.completed
      moderation-decision: moderation.decision
      monthly-payout-requested: monthly.payout.requested
      payout-registration-requested: payout.registration.requested
      payout-registration-completed: payout.registration.completed
    producer:
      send-timeout-seconds: 10
  scheduler:
    monthly-payout:
      enabled: true
      cron: "0 0 3 1 * *"
      lock-name: monthly-payout-scheduler
      lock-ttl-seconds: 300
    payout-registration-retry:
      enabled: true
      fixed-delay-ms: 60000
  outbox:
    datasource:
      url: jdbc:postgresql://127.0.0.1:5433/youtube_monetization_outbox
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      unique-resource-name: youtubeMonetizationOutboxXaDs
      min-pool-size: 2
      max-pool-size: 10
    flyway:
      enabled: true
      locations: classpath:db/outbox
    lock:
      ttl-seconds: 30
  messaging:
    moderation:
      channel: moderation.decision
    outbox:
      poll-delay-ms: 1000
