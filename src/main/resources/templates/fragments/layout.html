<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(currentPage, user)">
    <div class="topbar">
        <div>
            <div class="eyebrow">Creator Studio</div>
            <h1>Авторский кабинет канала</h1>
        </div>
        <div class="topbar-meta">
            <div><strong th:text="${user != null ? user.fullName : 'Demo Author'}">Demo Author</strong></div>
            <div class="muted" th:text="${user != null ? user.channelName : 'Demo Channel'}">Demo Channel</div>
        </div>
    </div>
    <nav class="nav">
        <a th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/videos}" th:classappend="${currentPage == 'videos'} ? ' active'">Видео</a>
        <a th:href="@{/revenues}" th:classappend="${currentPage == 'revenues'} ? ' active'">Доходы</a>
        <a th:href="@{/payouts}" th:classappend="${currentPage == 'payouts'} ? ' active'">Выплаты</a>
        <a th:if="${user != null and (user.role == 'MODERATOR' or user.role == 'ADMIN')}" th:href="@{/moderation}" th:classappend="${currentPage == 'moderation'} ? ' active'">Модерация</a>
        <a th:if="${user != null and user.role == 'ADMIN'}" th:href="@{/admin}" th:classappend="${currentPage == 'admin'} ? ' active'">Admin</a>
        <form th:action="@{/logout}" method="post" style="margin-left:auto;">
            <button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </nav>
</header>

<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${successMessage}">
        <span class="alert-icon">✅</span>
        <div class="alert-body">
            <span class="alert-title">Успешно</span>
            <span th:text="${successMessage}"></span>
        </div>
    </div>
    <div class="alert alert-danger" th:if="${errorMessage}">
        <span class="alert-icon">⚠️</span>
        <div class="alert-body">
            <span class="alert-title">Ошибка</span>
            <span th:text="${errorMessage}"></span>
        </div>
    </div>
</div>
</body>
</html>
