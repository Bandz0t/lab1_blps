<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование видео</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: header(${currentPage}, ${user})}"></header>
    <main class="content narrow">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <section class="panel">
            <div class="eyebrow">Экран 5</div>
            <h2>Редактирование после claim ✂️</h2>
            <p>Этот экран показывает цикл BPMN: claim → edit → повторная проверка.</p>

            <div class="claim-card" th:each="claim : ${claims}">
                <div class="claim-header">
                    <strong th:text="${claim.claimType}">AUDIO</strong>
                    <span th:class="${@ui.badgeClass(claim.status)}" th:text="${@ui.statusLabel(claim.status)}"></span>
                </div>
                <p th:text="${claim.description ?: 'Описание отсутствует.'}"></p>
                <div class="muted">Fragment: <span th:text="${claim.detectedFragment ?: '—'}"></span></div>
            </div>

            <form method="post" th:action="@{/videos/{id}/edit(id=${video.id})}" th:object="${editForm}" class="form-grid">
                <label class="full-width">
                    Новый путь к файлу
                    <input type="text" th:field="*{newFilePath}" required>
                </label>
                <label class="full-width">
                    Комментарий
                    <textarea th:field="*{comment}" rows="4"></textarea>
                </label>
                <div class="form-actions full-width">
                    <a class="button button-secondary" th:href="@{/videos/{id}(id=${video.id})}">Назад</a>
                    <button class="button" type="submit">Отправить на повторную проверку</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
