<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="auth-page">
    <section class="auth-card glass-panel">
        <div class="eyebrow">Новый автор</div>
        <h2>Регистрация автора</h2>
        <p class="muted">Создайте аккаунт, чтобы загружать видео, отслеживать монетизацию и получать выплаты.</p>

        <form th:action="@{/register}" method="post" th:object="${registerForm}" class="form-grid top-gap">
            <div>
                <label>Логин</label>
                <input type="text" th:field="*{username}" required>
                <small class="muted" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
            </div>
            <div>
                <label>Email</label>
                <input type="email" th:field="*{email}" required>
                <small class="muted" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>
            <div>
                <label>Полное имя</label>
                <input type="text" th:field="*{fullName}" required>
            </div>
            <div>
                <label>Название канала</label>
                <input type="text" th:field="*{channelName}" required>
            </div>
            <div class="full-width">
                <label>Пароль</label>
                <input type="password" th:field="*{password}" required>
            </div>
            <div class="auth-actions full-width">
                <button class="button" type="submit">Создать аккаунт</button>
                <a class="button button-secondary" th:href="@{/login}">Назад ко входу</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
