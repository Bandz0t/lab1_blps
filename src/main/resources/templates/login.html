<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="auth-page">
    <section class="auth-card glass-panel">
        <div class="eyebrow">Creator Studio</div>
        <h2>Вход в систему</h2>
        <p class="muted">Войдите под своей ролью: автор, модератор или администратор.</p>

        <div class="alert alert-danger top-gap" th:if="${param.error}">
            <span class="alert-icon">●</span>
            <div class="alert-body">
                <span class="alert-title">Ошибка входа</span>
                <span>Неверный логин или пароль.</span>
            </div>
        </div>

        <div class="alert alert-success top-gap" th:if="${param.logout}">
            <span class="alert-icon">●</span>
            <div class="alert-body">
                <span class="alert-title">Выход выполнен</span>
                <span>Вы вышли из аккаунта.</span>
            </div>
        </div>

        <div class="alert alert-success top-gap" th:if="${successMessage}">
            <span class="alert-icon">●</span>
            <div class="alert-body">
                <span class="alert-title">Успешно</span>
                <span th:text="${successMessage}"></span>
            </div>
        </div>

        <form th:action="@{/login}" method="post" class="form-grid top-gap">
            <div class="full-width">
                <label>Логин</label>
                <input type="text" name="username" required>
            </div>
            <div class="full-width">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <div class="auth-actions full-width">
                <button class="button" type="submit">Войти</button>
                <a class="button button-secondary" th:href="@{/register}">Регистрация</a>
            </div>
        </form>
    </section>
</div>
</body>
</html>
