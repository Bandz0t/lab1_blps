<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Выплаты</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: header(${currentPage}, ${user})}"></header>
    <main class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <section class="panel">
            <div class="eyebrow">Экран 9</div>
            <h2>История выплат 💳</h2>
            <table>
                <thead>
                <tr>
                    <th>Период</th>
                    <th>Сумма</th>
                    <th>Статус</th>
                    <th>Дата обработки</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payout : ${payouts}">
                    <td th:text="${payout.periodMonth + '/' + payout.periodYear}">3/2026</td>
                    <td th:text="${@ui.money(payout.totalAmount, 'USD')}">0.00 USD</td>
                    <td><span th:class="${@ui.badgeClass(payout.status)}" th:text="${@ui.statusLabel(payout.status)}"></span></td>
                    <td th:text="${@ui.formatDateTime(payout.processedAt)}">18.03.2026</td>
                </tr>
                <tr th:if="${payouts.isEmpty()}">
                    <td colspan="4">Выплат еще нет.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
